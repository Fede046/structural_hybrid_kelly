[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structural-hybrid-kelly"
version = "0.1.0"
description = "Analytical Kelly criterion and structural hybrid models"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "statsmodels",
    "arch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shk"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
# solo test_*.py: gli script e i moduli che finiscono in _test.py (us_c41_test, full_kelly_test,
# us_c5_2_daily_z_test) non sono test, e importarli imposta variabili d'ambiente come SHK_ELO_ENTRY
python_files = ["test_*.py"]

