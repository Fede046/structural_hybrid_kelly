[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structural-hybrid-kelly"
version = "0.1.0"
description = "Analytical Kelly criterion and structural hybrid models"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shk"]

